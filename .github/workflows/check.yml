name: check

on:
  workflow_dispatch: {}
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - run: npm run lint
      - run: npm run test:run
        if: ${{ !cancelled() }}
