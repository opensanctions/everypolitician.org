version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Applies only to non-security version updates.
      # Dependabot security updates are always triggered by a security advisory, rather
      # than running according to the schedule you have set in the dependabot.yml
      # for version updates.
      # See https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/customizing-dependabot-security-prs
      interval: "weekly"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      # Kept apart so one breaking bump can't hold back the safe updates
      major:
        patterns: ["*"]
        update-types:
          - "major"
    open-pull-requests-limit: 99
    versioning-strategy: increase-if-necessary
